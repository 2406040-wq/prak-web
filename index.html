<!DOCTYPE html>
<html lang="id">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Aplikasi To-Do List - Modul 5</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
   <div class="todo-app">
      <h2>Daftar Tugas Saya</h2>

      <!-- FITUR 1: Penghitung Jumlah Tugas -->
      <div id="taskCounter"
         style="text-align: center; margin-bottom: 15px; font-weight: bold; color: #475569; font-size: 14px;"></div>

      <!-- Form Input Tugas -->
      <form id="todoForm" novalidate>
         <div class="input-section">
            <input type="text" id="taskInput" placeholder="Ketikkan tugas baru Anda...">
            <button type="submit" class="add-btn">Tambah</button>
         </div>
         <div class="error-message" id="inputError">Tugas tidak boleh kosong atau
            kurang dari 3 karakter!</div>
      </form>

      <!-- Daftar Tugas -->
      <ul class="todo-list" id="todoList"></ul>

      <!-- FITUR 2: Tombol Bersihkan Tugas Selesai -->
      <button id="clearCompletedBtn" class="action-btn delete-btn"
         style="width: 100%; margin-top: 15px; padding: 10px; display: none;">Bersihkan Tugas Selesai</button>

   </div>

   <script src="script.js"></script>
</body>

</html>
