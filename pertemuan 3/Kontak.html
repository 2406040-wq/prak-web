<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 2 Form Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="halaman-kontak">

    <header class="kontak-header">
        <h1>Kontak Saya</h1>
    </header>

    <hr>

    <main class="kontak-main">
        <section class="kontak-card">

            <h2>Kirimkan Pesan atau pembayaran proyek</h2>

            <form>
                <p>
                    <label for="Yusuf_AD">
                        Yusuf Ahmad Dinar:
                    </label><br>
                    <input type="text" id="Yusuf_AD" name="Yusuf_AD">
                </p>

                <p>
                    <label for="email_pengirim">
                        Alamat Email:
                    </label><br>
                    <input type="email" id="email_pengirim" name="email_pengirim">
                </p>

                <p>
                    <label for="jenis_layanan">
                        Layanan yang dibutuhkan:
                    </label><br>

                    <select id="jenis_layanan" name="jenis_Layanan">
                        <option value="">
                            -- Pilih layanan --
                        </option>
                        <option value="web">
                            Pembuatan web
                        </option>
                        <option value="app">
                            pengembangan Aplikasi
                        </option>
                        <option value="other">
                            lain-lain
                        </option>
                    </select>
                </p>

                <p>
                    <label for="pesan">pesan:</label><br>
                    <textarea id="pesan" name="pesan" rows="6" cols="50"></textarea>
                </p>

                <p class="kontak-buttons">
                    <button type="submit">
                        kirim pesan
                    </button>

                    <button type="reset">
                        Batal / Reset
                    </button>
                </p>
            </form>

        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 teknik informatika ITG</p>
    </footer>

</body>

</html>
